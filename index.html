<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Lost and Found</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://lost-found-257a242a.base44.app/Home?embed=true" 
            title="MS Lost and Found"
            allowfullscreen
            id="lost-found-iframe">
    </iframe>
    <script>
        // Wait for DOM to be ready before adding event listeners
        window.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('lost-found-iframe');
            
            // Function to remove edit badges
            function removeEditBadges() {
                // Look for common edit badge selectors
                const selectors = [
                    '.edit-badge',
                    '#edit-badge',
                    '[class*="edit-badge"]',
                    '[id*="edit-badge"]',
                    '.base44-edit-badge',
                    '.softr-edit-button'
                ];
                
                let removed = false;
                selectors.forEach(function(selector) {
                    const elements = document.querySelectorAll(selector);
                    if (elements.length > 0) {
                        elements.forEach(function(element) {
                            element.remove();
                            removed = true;
                        });
                        console.log('Removed', elements.length, 'element(s) matching selector:', selector);
                    }
                });
                
                if (!removed) {
                    console.log('No edit badge elements found to remove');
                }
            }
            
            // Remove badges after iframe loads
            iframe.addEventListener('load', removeEditBadges);
            
            // Also watch for dynamically added edit badges using MutationObserver
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.addedNodes.length > 0) {
                        removeEditBadges();
                    }
                });
            });
            
            // Start observing the document body for added nodes
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        });
    </script>
</body>
</html>
