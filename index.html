<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Lost and Found</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://lost-found-257a242a.base44.app/Home" 
            title="MS Lost and Found"
            allowfullscreen
            id="lost-found-iframe">
    </iframe>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('lost-found-iframe');
            
            iframe.addEventListener('load', function() {
                // After iframe loads, remove any edit badge that may have been added
                // Look for common edit badge selectors
                const selectors = [
                    '.edit-badge',
                    '#edit-badge',
                    '[class*="edit-badge"]',
                    '[id*="edit-badge"]',
                    '.base44-edit-badge',
                    '.softr-edit-button'
                ];
                
                selectors.forEach(function(selector) {
                    const elements = document.querySelectorAll(selector);
                    elements.forEach(function(element) {
                        element.remove();
                        console.log('Removed edit badge element:', selector);
                    });
                });
            });
        });
    </script>
</body>
</html>
