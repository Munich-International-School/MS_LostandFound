<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="600">
    <title>MS Lost and Found</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://lost-found-257a242a.base44.app/Home?embed=true" 
            title="MS Lost and Found"
            allowfullscreen
            id="lost-found-iframe">
    </iframe>
    <script>
        // This page reloads every 10 minutes to keep the Lost and Found content fresh.
        // Wait for DOM to be ready before adding event listeners
        window.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('lost-found-iframe');
            
            // Function to remove edit badges
            function removeEditBadges() {
                // Look for common edit badge selectors
                const selectors = [
                    '.edit-badge',
                    '#edit-badge',
                    '[class*="edit-badge"]',
                    '[id*="edit-badge"]',
                    '.base44-edit-badge',
                    '.softr-edit-button'
                ];
                
                let totalRemoved = 0;
                selectors.forEach(function(selector) {
                    const elements = document.querySelectorAll(selector);
                    if (elements.length > 0) {
                        const count = elements.length;
                        elements.forEach(function(element) {
                            element.remove();
                        });
                        console.log('Removed', count, 'element(s) matching selector:', selector);
                        totalRemoved += count;
                    }
                });
                
                if (totalRemoved === 0) {
                    console.log('No edit badge elements found to remove');
                }
                
                return totalRemoved;
            }
            
            // Remove badges after iframe loads
            iframe.addEventListener('load', removeEditBadges);
            
            // Debounce function to limit how often removeEditBadges is called
            let debounceTimer;
            function debouncedRemoveEditBadges() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(removeEditBadges, 100);
            }
            
            // Watch for dynamically added edit badges using MutationObserver
            const observer = new MutationObserver(function(mutations) {
                // Check if any of the added nodes could be edit badges
                let shouldCheck = false;
                for (let mutation of mutations) {
                    if (mutation.addedNodes.length > 0) {
                        for (let node of mutation.addedNodes) {
                            if (node.nodeType === Node.ELEMENT_NODE) {
                                shouldCheck = true;
                                break;
                            }
                        }
                    }
                    if (shouldCheck) break;
                }
                
                if (shouldCheck) {
                    debouncedRemoveEditBadges();
                }
            });
            
            // Start observing the document body for added nodes
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        });
    </script>
</body>
</html>
